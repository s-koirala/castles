[project]
name = "castles"
version = "0.0.1"
description = "castles - a standing cross-domain research think tank producing systematic reviews and methodology documentation, with forensic treatment of null and negative results as its distinctive method"
requires-python = ">=3.11,<3.13"
authors = [{name = "Sajan Koirala", email = "238704148+s-koirala@users.noreply.github.com"}]
license = {text = "MIT"}
readme = "README.md"

[project.optional-dependencies]
# Justify: ruff/pytest/pre-commit are the user's tooling defaults
# (CLAUDE.md "Tooling defaults"). nbstripout + nbqa for notebooks.
dev = [
    "ruff",
    "pytest",
    "pre-commit",
    "nbstripout",
    "nbqa",
    "pyyaml",          # for precommit_citation_cff.py
    "jsonschema>=4.18", # Draft 2020-12 support; justify: R1-A schema needs Draft 2020-12
]

# Justify: pandera for schema validation (validate-data SKILL.md §2);
# pandas/numpy/scipy are the foundational data stack.
data = [
    "pandas",
    "numpy",
    "scipy",
    "pandera",
    "pyarrow",          # parquet
]

# Justify: matplotlib/seaborn for figures; defaults set by deliver-results
# skill's skie.mplstyle (R2-C).
viz = [
    "matplotlib",
    "seaborn",
    "great_tables",     # publication tables (R2-C)
]

[build-system]
# Defer per memo §5 Q1 default = no build-system declaration; matches
# SKIE-Universe pattern. Uncomment to make installable:
# requires = ["hatchling"]
# build-backend = "hatchling.build"

[tool.ruff]
line-length = 100  # justify: user's CLAUDE.md tooling defaults; matches SKIE-Universe
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# Justify: E/F/W from pycodestyle/pyflakes; I from isort; N for naming;
# B from bugbear; UP for pyupgrade; SIM for simplification; PL for pylint
# (with PLR0913 disabled — too many args is sometimes unavoidable in
# research code where signatures grow naturally).
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
